<html lang="en">

<meta name="description" content="Live gold 1H chart with the Aurum Gold supply/demand + support/resistance signals.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6dff'/%3E%3Cpath d='M9 22 16 8l7 14z' fill='%23f7d77c'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#060e22;--panel:#0b1833;--panel2:#0f2147;--chart:#081429;--line:#1a2f5c;--text:#e8eefc;--muted:#8394bb;
  --grid:rgba(120,160,255,.07);--accent:#3d8bff;--accent2:#7ec3ff;--glow:rgba(61,139,255,.35);
  --gold:#f2c14e;--up:#22d3a0;--down:#ff5c74;--upbg:rgba(34,211,160,.14);--downbg:rgba(255,92,116,.13);
  --demand:rgba(34,211,160,.12);--supply:rgba(255,92,116,.12);--warn:#ffb547;--chip:#112656;
  --candle-up:#22d3a0;--candle-down:#ff5c74;
  --hdr:linear-gradient(100deg,#0a1a3d 0%,#0d2766 55%,#123a8a 100%);
  --card:linear-gradient(140deg,rgba(61,139,255,.22) 0%,rgba(61,139,255,.04) 60%,transparent 100%);
}
:root[data-theme="light"]{
  --bg:#edf2fc;--panel:#ffffff;--panel2:#f4f7ff;--chart:#ffffff;--line:#d5dff3;--text:#0c1a3a;--muted:#5a6a8e;
  --grid:rgba(30,80,200,.07);--accent:#1f6fff;--accent2:#1a5ad6;--glow:rgba(31,111,255,.22);
  --gold:#b07d0a;--up:#0a9b72;--down:#df3550;--upbg:rgba(10,155,114,.11);--downbg:rgba(223,53,80,.10);
  --demand:rgba(10,155,114,.12);--supply:rgba(223,53,80,.11);--warn:#c46a00;--chip:#e9f0fd;
  --candle-up:#0a9b72;--candle-down:#df3550;
  --hdr:linear-gradient(100deg,#0d2766 0%,#1a4fc4 60%,#2f74ff 100%);
  --card:linear-gradient(140deg,rgba(31,111,255,.14) 0%,rgba(31,111,255,.03) 60%,transparent 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--hdr);color:#f2f6ff;flex-wrap:wrap;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 6px 24px rgba(3,10,30,.35);position:relative;z-index:2}
header .muted{color:rgba(225,235,255,.72)}
header .up{color:#5ff0c3}header .down{color:#ff8a9b}
header .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#f2f6ff}
header .btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35)}
header .btn.on{border-color:#8fd0ff;color:#fff;box-shadow:0 0 0 3px rgba(126,195,255,.25)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.14em;font-size:13.5px}
.brand small{font-weight:600;letter-spacing:.2em;font-size:9.5px;padding:2px 6px;border-radius:999px;background:linear-gradient(90deg,#f7d77c,#e2a92c);color:#2a1d00}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#7ec3ff,#2f6dff 55%,#1a3fae);display:inline-block;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 4px 14px rgba(47,109,255,.55)}
.brand i:after{content:"";position:absolute;left:7px;top:7px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #f7d77c}
.price{font-size:21px;font-weight:700;color:#fff;text-shadow:0 0 18px rgba(126,195,255,.35)}
.chg{font-size:13px}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.warn{color:var(--warn)}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(225,235,255,.75);padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--up);box-shadow:0 0 0 3px var(--upbg)}
.dot.bad{background:var(--down)}
.spacer{flex:1}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13px;transition:border-color .15s,box-shadow .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.on{border-color:var(--accent);color:var(--accent2);box-shadow:0 0 0 3px var(--glow)}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;height:calc(100% - 57px)}
#chartWrap{position:relative;min-height:360px;border-right:1px solid var(--line);background:var(--chart)}
#chart{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
#legend{position:absolute;left:12px;top:8px;font-size:12px;pointer-events:none;color:var(--muted)}
#legend b{color:var(--text);font-weight:600}
#toLatest{position:absolute;right:76px;bottom:34px;display:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
aside{background:var(--panel);overflow:auto;display:flex;flex-direction:column}
.card{margin:12px 12px 4px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);overflow:hidden}
.status{padding:14px 16px;margin:14px 12px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.status:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.status .big{font-size:27px;font-weight:800;letter-spacing:.04em;color:var(--accent2)}
.status.buy{background:linear-gradient(140deg,var(--upbg),transparent)}.status.buy:before{background:var(--up)}.status.buy .big{color:var(--up)}
.status.sell{background:linear-gradient(140deg,var(--downbg),transparent)}.status.sell:before{background:var(--down)}.status.sell .big{color:var(--down)}
.status .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.rows{padding:2px 14px;margin:8px 12px 0;background:var(--panel2);border:1px solid var(--line);border-radius:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted);white-space:nowrap}
.row .v{text-align:right}
.sec{padding:12px 24px 2px;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--accent2);text-transform:uppercase}
.gradeA{color:var(--up);font-weight:700}.gradeB{color:var(--gold);font-weight:700}.gradeC{color:var(--muted);font-weight:700}
.last20{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.last20 span{width:9px;height:9px;border-radius:2px;background:var(--muted)}
.last20 .w{background:var(--up)}.last20 .l{background:var(--down)}
.tabs{display:flex;gap:6px;padding:12px 16px 0;border-top:1px solid var(--line);margin-top:auto}
.tabs .btn{font-size:12px;padding:5px 9px}
#tabBody{padding:8px 16px 16px;font-size:12.5px}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:11.5px}
label.f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
label.f select,label.f input{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 7px;max-width:150px;outline:none}
label.f select:focus,label.f input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
label.f input[type=checkbox]{accent-color:var(--accent)}
tr[data-bar]:hover td{background:var(--chip)}
label.f input[type=checkbox]{width:16px;height:16px}
.note{color:var(--muted);font-size:12px;margin:8px 0}
.foot{padding:10px 16px 14px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--line)}
@media (max-width:860px){
  main{grid-template-columns:1fr;height:auto}
  #chartWrap{height:62vh;border-right:0;border-bottom:1px solid var(--line)}
  header{padding:8px 16px;gap:10px}
  .price{font-size:18px}
}
</style>

<body>
<header>
  <div class="brand"><i></i>AURUM GOLD <small>PRO</small></div>
  <div><span id="sym" class="muted">PAXG/USDT · 1H</span></div>
  <div class="price num" id="price">—</div>
  <div class="chg num" id="chg"></div>
  <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">connecting…</span></div>
  <div class="spacer"></div>
  <button class="btn" id="alertBtn" title="Browser notification + sound on every new signal">🔔 Alerts off</button>
  <button class="btn" id="themeBtn" title="Light / dark">Theme</button>
</header>
<main>
  <div id="chartWrap">
    <canvas id="chart"></canvas>
    <div id="legend"></div>
    <button class="btn" id="toLatest">Latest ›</button>
    <div id="loading">Loading gold prices…</div>
  </div>
  <aside>
    <div class="status" id="statusBox"><div class="big" id="statusBig">WAIT</div><div class="sub" id="statusSub">—</div></div>
    <div class="rows" id="planRows"></div>
    <div class="sec">Record (this chart's history)</div>
    <div class="rows" id="recRows"></div>
    <div class="tabs">
      <button class="btn on" data-tab="trades">Trades</button>
      <button class="btn" data-tab="settings">Settings</button>
      <button class="btn" data-tab="about">About</button>
    </div>
    <div id="tabBody"></div>
    <div class="foot">Signals only — this page never places trades. Demo research, not financial advice.</div>
  </aside>
</main>
<script src="aurum.js"></script>
<script>
(function () {
"use strict";
var A = window.Aurum;
var $ = function (id) { return document.getElementById(id); };
var H = 3600000;

// ---------------- settings ----------------
var SKEY = "aurum.web.settings.v1";
var cfg = Object.assign({}, A.DEFAULTS, { source: "paxg", tdKey: "", showAll: false, showPast: true, alerts: false, theme: "" });
try { Object.assign(cfg, JSON.parse(localStorage.getItem(SKEY) || "{}")); } catch (e) {}
function save() { try { localStorage.setItem(SKEY, JSON.stringify(cfg)); } catch (e) {} }
if (cfg.theme) document.documentElement.setAttribute("data-theme", cfg.theme);

// ---------------- state ----------------
var closed = [];        // closed 1H candles while the gold market is open
var forming = null;     // the live candle
var result = null, trend = null, sessL = [], sessN = [], preview = null;
var lastPrice = null, booted = false;

// ---------------- formatting ----------------
function fp(x) { return x == null || isNaN(x) ? "—" : x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fr(x) { return (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2) + "R"; }
function pct(x) { return (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2) + "%"; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
var dtf = new Intl.DateTimeFormat(undefined, { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: false });
function fdt(ms) { return dtf.format(new Date(ms)); }

// ---------------- engine ----------------
function compute() {
  if (closed.length < 60) return;
  var t = A.trend4H(closed, 60);
  trend = t;
  sessL = closed.map(function (b) { return A.inLondon(b.t); });
  sessN = closed.map(function (b) { return A.inNewYork(b.t); });
  var allowed = cfg.sessions === "All day" ? null : closed.map(function (b, i) {
    return cfg.sessions === "London only" ? sessL[i] : cfg.sessions === "New York only" ? sessN[i] : sessL[i] || sessN[i];
  });
  var prev = result;
  result = A.run(closed, t.dir, cfg, { allowed: allowed, london: sessL, newyork: sessN });
  // new confirmed signal on the candle that just closed -> alert
  var last = result.signals[result.signals.length - 1];
  if (booted && prev && last && last.bar === closed.length - 1) notify(last);
  computePreview();
}
// Would the live candle be a signal if it closed at the current price? (not confirmed)
var previewAt = 0;
function computePreview() {
  preview = null;
  if (!result || !forming || result.open) return;
  var now = Date.now();
  if (now - previewAt < 1500) return;
  previewAt = now;
  var bars = closed.concat([forming]);
  var t = A.trend4H(bars, 60).dir;
  var allowed = cfg.sessions === "All day" ? null : bars.map(function (b) {
    var l = A.inLondon(b.t), n = A.inNewYork(b.t);
    return cfg.sessions === "London only" ? l : cfg.sessions === "New York only" ? n : l || n;
  });
  var r = A.run(bars, t, cfg, { allowed: allowed, london: bars.map(function (b) { return A.inLondon(b.t); }), newyork: bars.map(function (b) { return A.inNewYork(b.t); }) });
  var s = r.signals[r.signals.length - 1];
  if (s && s.bar === bars.length - 1) preview = s;
}

// ---------------- alerts ----------------
function beep() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18].forEach(function (d) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.15, ctx.currentTime + d); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d + 0.15);
      o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.16);
    });
  } catch (e) {}
}
function notify(s) {
  var key = "aurum.web.lastAlert";
  try { if (localStorage.getItem(key) === String(s.t)) return; localStorage.setItem(key, String(s.t)); } catch (e) {}
  if (!cfg.alerts) return;
  var side = s.side > 0 ? "BUY" : "SELL";
  var body = "Grade " + s.grade + " " + s.quality + "/100 | Entry " + fp(s.entry) + " | SL " + fp(s.sl) + " | TP " + fp(s.tp) + " | RR 1:" + s.rr.toFixed(1) + " | " + s.why;
  beep();
  try { if ("Notification" in window && Notification.permission === "granted") new Notification("Aurum " + side + " gold 1H", { body: body }); } catch (e) {}
}
function alertBtn() {
  $("alertBtn").textContent = cfg.alerts ? "🔔 Alerts on" : "🔔 Alerts off";
  $("alertBtn").classList.toggle("on", !!cfg.alerts);
}
$("alertBtn").onclick = function () {
  cfg.alerts = !cfg.alerts; save(); alertBtn();
  if (cfg.alerts && "Notification" in window && Notification.permission === "default") Notification.requestPermission();
  if (cfg.alerts) beep();
};
$("themeBtn").onclick = function () {
  var dark = document.documentElement.getAttribute("data-theme") !== "light";
  cfg.theme = dark ? "light" : "dark"; save();
  document.documentElement.setAttribute("data-theme", cfg.theme);
  readColors(); dirty();
};

// ---------------- data feeds ----------------
function setLive(state, text) {
  $("dot").className = "dot" + (state === "on" ? " on" : state === "bad" ? " bad" : "");
  $("liveTxt").textContent = text;
}
function mergeBar(b) {      // b = {t,o,h,l,c,final}
  if (!A.goldMarketOpen(b.t)) { var lt = forming ? forming.t : closed.length ? closed[closed.length - 1].t : 0; if (b.t > lt) lastPrice = b.c; return false; }   // PAXG weekend / daily-break hours are left out
  var lastClosed = closed[closed.length - 1];
  if (b.final) {
    if (lastClosed && b.t <= lastClosed.t) { if (b.t === lastClosed.t) closed[closed.length - 1] = strip(b); return false; }
    closed.push(strip(b)); if (forming && forming.t <= b.t) forming = null;
    lastPrice = b.c;
    return true;
  }
  if (!lastClosed || b.t > lastClosed.t) forming = strip(b);
  lastPrice = b.c;
  return false;
}
function strip(b) { return { t: b.t, o: b.o, h: b.h, l: b.l, c: b.c }; }

var BIN_REST = ["https://api.binance.com", "https://data-api.binance.vision"];
var BIN_WS = ["wss://stream.binance.com:9443/ws/paxgusdt@kline_1h", "wss://data-stream.binance.vision/ws/paxgusdt@kline_1h"];
var restBase = null, ws = null, wsIdx = 0, wsRetry = 0, lastMsg = 0, pollTimer = null;

function fetchJSON(url) {
  return fetch(url, { cache: "no-store" }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error(r.status + " " + t.slice(0, 120)); });
    return r.json();
  });
}
function binKlines(endTime, limit) {
  var q = "/api/v3/klines?symbol=PAXGUSDT&interval=1h&limit=" + (limit || 1000) + (endTime ? "&endTime=" + endTime : "");
  var tries = restBase ? [restBase] : BIN_REST.slice();
  function attempt(k) {
    return fetchJSON(tries[k] + q).then(function (d) { restBase = tries[k]; return d; }, function (e) {
      if (k + 1 < tries.length) return attempt(k + 1);
      throw e;
    });
  }
  return attempt(0);
}
function binBar(k, now) { return { t: +k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], final: +k[6] < now }; }

function loadPaxg() {
  $("sym").textContent = "PAXG/USDT · 1H";
  var pages = [], end = null, n = 0;
  function next() {
    return binKlines(end, 1000).then(function (d) {
      if (!d.length) return;
      pages.unshift(d); end = +d[0][0] - 1; n++;
      if (n < 4 && d.length === 1000) return next();
    });
  }
  return next().then(function () {
    var now = Date.now();
    closed = []; forming = null;
    pages.forEach(function (p) { p.forEach(function (k) { mergeBar(binBar(k, now)); }); });
    connectWs();
  });
}
function connectWs() {
  try { if (ws) ws.close(); } catch (e) {}
  var url = BIN_WS[wsIdx % BIN_WS.length];
  ws = new WebSocket(url);
  ws.onopen = function () { wsRetry = 0; setLive("on", "live"); };
  ws.onmessage = function (ev) {
    lastMsg = Date.now();
    var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    var k = m.k; if (!k) return;
    var b = { t: +k.t, o: +k.o, h: +k.h, l: +k.l, c: +k.c, final: !!k.x };
    var newClose = mergeBar(b);
    if (b.final) {
      // keep the forming slot empty until the next candle's first update
      if (newClose) compute();
    }
    tick();
  };
  ws.onclose = function () {
    setLive("bad", "reconnecting…");
    wsIdx++; wsRetry++;
    setTimeout(connectWs, Math.min(30000, 1000 * Math.pow(2, Math.min(wsRetry, 5))));
  };
  ws.onerror = function () { try { ws.close(); } catch (e) {} };
}
// Safety net: if the stream is silent, refresh the last candles over REST.
setInterval(function () {
  if (cfg.source !== "paxg" || !closed.length) return;
  if (Date.now() - lastMsg < 45000) return;
  binKlines(null, 5).then(function (d) {
    var now = Date.now(), changed = false;
    d.forEach(function (k) { changed = mergeBar(binBar(k, now)) || changed; });
    if (changed) compute();
    tick();
  }).catch(function () {});
}, 30000);

// Twelve Data: real XAU/USD with the viewer's own free API key (polled every 2 minutes).
function tdUrl(size) {
  return "https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=1h&timezone=UTC&order=ASC&outputsize=" + size + "&apikey=" + encodeURIComponent(cfg.tdKey);
}
function tdBars(d) {
  if (d.status === "error" || !d.values) throw new Error(d.message || "Twelve Data error");
  var now = Date.now();
  return d.values.map(function (v) {
    var p = v.datetime.split(/[- :]/).map(Number);
    var t = Date.UTC(p[0], p[1] - 1, p[2], p[3] || 0, p[4] || 0);
    return { t: t, o: +v.open, h: +v.high, l: +v.low, c: +v.close, final: t + H <= now };
  });
}
function loadTwelve() {
  $("sym").textContent = "XAU/USD · 1H (Twelve Data)";
  return fetchJSON(tdUrl(5000)).then(function (d) {
    closed = []; forming = null;
    tdBars(d).forEach(mergeBar);
    setLive("on", "updates every 2 min");
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      fetchJSON(tdUrl(3)).then(function (d2) {
        var changed = false;
        tdBars(d2).forEach(function (b) { changed = mergeBar(b) || changed; });
        if (changed) compute();
        setLive("on", "updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
        tick();
      }).catch(function (e) { setLive("bad", "update failed: " + e.message.slice(0, 40)); });
    }, 120000);
  });
}

function start() {
  $("loading").style.display = "flex";
  $("loading").textContent = "Loading gold prices…";
  booted = false;
  try { if (ws) { ws.onclose = null; ws.close(); } } catch (e) {}
  if (pollTimer) clearInterval(pollTimer);
  var p = cfg.source === "twelve" && cfg.tdKey ? loadTwelve() : loadPaxg();
  p.then(function () {
    $("loading").style.display = "none";
    compute(); booted = true; view.offset = 0; tick(); renderTab();
  }).catch(function (e) {
    setLive("bad", "no data");
    $("loading").innerHTML = "Could not load prices.<br><span class='num'>" + esc(e.message) + "</span><br><br>" +
      (cfg.source === "twelve" ? "Check your Twelve Data key in Settings." : "Binance may be blocked on this network. Try another network, or use a Twelve Data key (Settings).") +
      "<br><br><button class='btn' onclick='location.reload()'>Retry</button>";
  });
}

// ---------------- panel ----------------

      ctx.closePath(); ctx.fill();
      ctx.font = "600 11px ui-sans-serif,system-ui,sans-serif"; ctx.textAlign = "center";
      ctx.fillText((s === preview ? "WATCH " : "") + (buy ? "BUY " : "SELL ") + s.grade, mx, buy ? my + 20 : my - 18);
      if (s.result != null) {
        var ex = xOf(s.exitBar, n), ey = y(s.how === "Stop loss" ? s.sl : s.how === "Take profit" ? s.tp : bars[s.exitBar].c);
        ctx.fillStyle = s.result >= 0 ? C.up : C.down;
        ctx.fillText(fr(s.result), ex, ey + (((s.result >= 0) === buy) ? -10 : 12));
      }
    });
  }
  // candles
  var bw = Math.max(1, Math.min(view.spacing * 0.7, view.spacing - 1));
  for (var k = i0; k <= i1; k++) {
    var c = bars[k], cx = Math.round(xOf(k, n)), upc = c.c >= c.o;
    ctx.strokeStyle = ctx.fillStyle = upc ? C["candle-up"] : C["candle-down"];
    if (k === n - 1 && forming) ctx.globalAlpha = 0.75;
    ctx.lineWidth = 1;

    var top = Math.round(y(Math.max(c.o, c.c))), bot = Math.round(y(Math.min(c.o, c.c)));
    ctx.fillRect(Math.round(cx - bw / 2) + 0.5, top, Math.max(1, Math.round(bw)), Math.max(1, bot - top));

  var lp = lastPrice != null ? lastPrice : bars[n - 1].c;
  var ly = Math.round(y(lp)) + 0.5, lastUp = bars[n - 1].c >= bars[n - 1].o;
  if (ly > 0 && ly < ph) {
    ctx.strokeStyle = lastUp ? C.up : C.down; ctx.setLineDash([1, 3]);
    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(pw, ly); ctx.stroke(); ctx.setLineDash([]);
    axisTag(ly, fp(lp), lastUp ? C.up : C.down, "#fff");
  }
  if (shown && (shown === open || shown === preview)) {
    [[shown.tp, C.up], [shown.sl, C.down]].forEach(function (q) { var yy = y(q[0]); if (yy > 0 && yy < ph) axisTag(yy, fp(q[0]), q[1], "#fff"); });
  }
  // crosshair
  var m = view.mouse;
  if (m && m.x < pw && m.y < ph) {
    ctx.strokeStyle = C.accent2; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
    var ci = Math.round(iOf(m.x, n)), cxx = Math.round(xOf(ci, n)) + 0.5;
    ctx.beginPath(); ctx.moveTo(cxx, 0); ctx.lineTo(cxx, ph); ctx.moveTo(0, Math.round(m.y) + 0.5); ctx.lineTo(pw, Math.round(m.y) + 0.5); ctx.stroke();
    ctx.setLineDash([]);
    axisTag(m.y, fp(pOf(m.y)), C.accent, "#fff");
    if (ci >= 0 && ci < n) {
      var cb = bars[ci];
      var lbl = fdt(cb.t);
      ctx.font = "11px ui-sans-serif,system-ui,sans-serif"; var tw = ctx.measureText(lbl).width + 12;
      ctx.fillStyle = C.accent; ctx.fillRect(cxx - tw / 2, ph, tw, TX); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.fillText(lbl, cxx, ph + TX / 2);

}
function axisTag(yy, text, bg, fg) {

// pointer interaction: drag, wheel, pinch, double-click
var pts = {}, drag = null, pinch = null;

cv.addEventListener("dblclick", function () { view.spacing = 9; view.offset = 0; dirty(); });
$("toLatest").onclick = function () { view.offset = 0; dirty(); };

// ---------------- header + loop ----------------
function renderHeader() {
  var bars = allBars(); if (!bars.length) return;

  $("chg").innerHTML = "<span class='" + (ch >= 0 ? "up" : "down") + "'>" + (ch >= 0 ? "+" : "−") + Math.abs(ch).toFixed(2) + " (" + (ch >= 0 ? "+" : "−") + Math.abs(ch / ref * 100).toFixed(2) + "%)</span> <span class='muted'>24h</span>";

function tick() { computePreview(); renderHeader(); renderPanel(); dirty(); }
